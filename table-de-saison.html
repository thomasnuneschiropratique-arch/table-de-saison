<title>Table de saison</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : carnet de cuisine en colonnes — bandeau, onglets collants, grille de jours qui s'empile sur téléphone */
:root{
  --bg:#EFF3EC; --surface:#FBFCF9; --soft:#E2EADF; --ink:#16241B; --muted:#56685C; --line:#CCD8CA;
  --accent:#2C6A43; --accent-ink:#FFFFFF; --sun:#B67A06; --sun-soft:#F6E7C4;
  --c-fish:#23708F; --c-vo:#B5651D; --c-rg:#9C3B32; --c-le:#4F7F1F; --c-oe:#C59A12; --c-b:#7A5AA6; --c-c:#6E7F73;
  --ok:#2C6A43; --warn:#A45A00; --bad:#A3332A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17211B; --soft:#1F2C24; --ink:#E4ECE5; --muted:#9BAEA1; --line:#2B3A31;
  --accent:#7CC596; --accent-ink:#0C1A11; --sun:#E7B550; --sun-soft:#3A2F16;
  --c-fish:#69B6D6; --c-vo:#E0975A; --c-rg:#E07A6F; --c-le:#9BC765; --c-oe:#E5C454; --c-b:#B79AE0; --c-c:#9BAEA1;
  --ok:#7CC596; --warn:#E7A24D; --bad:#EC7D72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --soft:#1F2C24; --ink:#E4ECE5; --muted:#9BAEA1; --line:#2B3A31;
  --accent:#7CC596; --accent-ink:#0C1A11; --sun:#E7B550; --sun-soft:#3A2F16;
  --c-fish:#69B6D6; --c-vo:#E0975A; --c-rg:#E07A6F; --c-le:#9BC765; --c-oe:#E5C454; --c-b:#B79AE0; --c-c:#9BAEA1;
  --ok:#7CC596; --warn:#E7A24D; --bad:#EC7D72; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{padding-block:22px 10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted)}
.season{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-current="page"]){background:var(--soft);color:var(--ink)}

main{padding-block:18px 60px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* hero du soir */
.tonight{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.tonight h2{font-size:clamp(20px,3.4vw,28px);font-weight:700}
.tonight .eyebrow{color:inherit;opacity:.7}
.tonight .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media (max-width:560px){.tonight{grid-template-columns:1fr}}

.weeknav{margin-bottom:12px}
.weeknav h2{font-size:22px;font-weight:700;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.chip .st{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.warn .st{background:var(--warn)}
.chip.bad .st{background:var(--bad)}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:400px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.day header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.day h3{font-size:18px;font-weight:700}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:5px;padding:2px 6px}
.tag.sport{background:var(--sun-soft);color:var(--sun)}
.tag.shop{background:var(--soft);color:var(--accent)}
.tag.now{background:var(--accent);color:var(--accent-ink)}
.tag.away{background:var(--soft);color:var(--warn)}
.who-btn{align-self:flex-start;font-size:13px;padding:4px 8px;color:var(--muted)}
table.abs th{background:transparent;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);position:static}
table.abs td,table.abs th{border-bottom:1px solid var(--line);padding:8px 10px}
.dkcal{margin-left:auto;font-size:12px;color:var(--muted)}
.meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.meal{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:start}
.slot{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:7px}
.mbtn{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;border:0;background:transparent;padding:5px 6px;border-radius:7px;cursor:pointer;min-width:0}
.mbtn:hover{background:var(--soft)}
.mname{font-weight:700;min-width:0}
.mmeta{display:block;font-size:12px;color:var(--muted);font-weight:400}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--c-c)}
.c-pg,.c-pm{background:var(--c-fish)} .c-vo{background:var(--c-vo)} .c-rg{background:var(--c-rg)} .c-le{background:var(--c-le)} .c-oe{background:var(--c-oe)} .c-b{background:var(--c-b)} .c-c{background:var(--c-c)}
.fast{padding:5px 6px;color:var(--muted);font-style:italic;font-size:14px}
.extra{font-size:13px;border-top:1px dashed var(--line);padding-top:7px;color:var(--muted)}
.extra b{color:var(--ink)}
.boost{font-size:13px;background:var(--sun-soft);border-radius:7px;padding:6px 8px}
.boost b{color:var(--sun)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on{color:var(--ok)} .sync.on::before{background:var(--ok)}
.sync.off{color:var(--warn)} .sync.off::before{background:var(--warn)}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}
.mini{display:block;margin-top:4px;border:0;background:none;padding:0;font:inherit;font-size:11px;font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer;white-space:nowrap;margin-left:auto}
.mini:hover{color:var(--accent)}
.item .alt{display:block;font-size:11px;color:var(--muted);font-style:italic}
.item .who{display:block;font-size:11px;font-weight:700;color:var(--accent)}
.group.miss{border-color:var(--sun)}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:0}
.mitem .u{display:block;font-size:12px;color:var(--muted)}
.mitem.done b{text-decoration:line-through;opacity:.55}
button.pill{font:inherit;font-size:13px;color:var(--ink)}
button.pill:hover{border-color:var(--accent)}
.gaspi{font-size:13px;background:var(--soft);border-radius:7px;padding:6px 8px}
.gaspi b{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{margin:0}

/* courses */
.course-head{display:grid;gap:4px;margin-bottom:14px}
.course-head h2{font-size:24px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.group h3{font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.group h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.group h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.items{list-style:none;margin:6px 0 0;padding:0}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.item label{min-width:0;cursor:pointer}
.item .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .u{display:block;font-size:12px;color:var(--muted)}
.item .hint{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);margin-top:2px}
.item.done label,.item.done .q{opacity:.45;text-decoration:line-through}
.note{background:var(--soft);border-radius:var(--r);padding:10px 12px;font-size:14px}

/* année */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--soft);position:sticky;top:0}
td.d{white-space:nowrap;font-weight:700}
tr.wk td{border-top:2px solid var(--line)}
tr.isToday td{background:var(--soft)}
td .lk{border:0;background:none;padding:0;cursor:pointer;text-align:left;color:inherit}
td .lk:hover{text-decoration:underline}
.fastc{color:var(--muted);font-style:italic}

/* recettes */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=search],input[type=number],input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rcard{display:flex;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;min-width:0}
.rcard:hover{border-color:var(--accent)}

/* repères */
.prose{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:20px;margin-bottom:8px}
.card p,.card li{max-width:65ch}
.card ul{padding-left:18px;margin:6px 0}
.card li{margin:4px 0}
.card table{font-size:13px}
.card .tablebox{margin-top:8px}
.wide{grid-column:1/-1}
.seasonbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

/* réglages */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.field{display:grid;gap:4px}
.field label{font-weight:700}
.field .help{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;background:var(--surface)}
.pill input{accent-color:var(--accent);margin:0}
.pill.on{border-color:var(--accent);background:var(--soft)}
.excl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:8px;background:var(--surface)}

/* modale */
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.overlay{align-items:center;padding-bottom:12px}}
.sheet{background:var(--surface);color:var(--ink);width:min(720px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h2{font-size:24px;margin:4px 0 8px}
.sheet .ings{columns:2 220px;list-style:none;padding:0;margin:8px 0}
.sheet .ings li{break-inside:avoid;padding:3px 0;border-bottom:1px dotted var(--line);display:flex;justify-content:space-between;gap:10px}
.sheet .ings li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .steps{background:var(--soft);border-radius:var(--r);padding:12px 14px 12px 34px;margin:8px 0 10px;display:grid;gap:8px}
.sheet .steps li{max-width:65ch;padding-left:2px}
.sheet .steps li::marker{font-weight:700;color:var(--accent)}
.alts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.alts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px;text-align:left}
.alts button:hover{border-color:var(--accent)}
.close{float:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-weight:700}
textarea.copy{width:100%;height:160px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (prefers-reduced-motion:no-preference){.mbtn,.btn,.rcard{transition:background .15s,border-color .15s}}
</style>

<header class="top wrap">
  <div class="brand">
    <h1>Table <span>de saison</span></h1>
    <p>Tes repas de l'année, et les dîners avec Anna · Toulouse</p>
  </div>
  <div class="season" id="seasonLine"></div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" id="tabs">
    <button data-view="semaine">Semaine</button>
    <button data-view="courses">Courses</button>
    <button data-view="manque" id="tabManque">Il manque</button>
    <button data-view="annee">Année</button>
    <button data-view="recettes">Recettes</button>
    <button data-view="reperes">Repères</button>
    <button data-view="reglages">Réglages</button>
  </div>
</nav>
<main class="wrap" id="main"></main>
<div id="modalRoot"></div>

/* Un plat convient-il ce jour-là ? En semaine : peu de préparation. Les longs mijotés (plus d'1 h) seulement si tu l'as choisi */
function timeOk(r, wd) {
  if (r.t !== "d" && r.t !== "l") return r.t !== "b" || r.a <= 10 || wd >= 5;
  if (r.m > 60 && !(S.longOk && wd >= 5)) return false;
  if (r.t === "l") return r.a <= (wd >= 5 ? S.maxWeekend : 15);
  return wd >= 5 ? r.a <= S.maxWeekend : r.a <= S.maxWeek && r.m <= 45;
}

// --- Poisson gras
truite_pdouce: ["Préchauffe le four à 200 °C.", "Épluche la patate douce et coupe-la en cubes de 2 cm. Mélange-les sur une plaque avec la moitié de l'huile, du sel et du poivre. Enfourne 15 min.", "Pendant ce temps, détaille le brocoli en petits bouquets.", "Ajoute le brocoli sur la plaque avec un filet d'huile, remets 8 min.", "Pose la truite côté peau sur la plaque, sale, poivre, et remets 8 min : elle est cuite quand la chair se détache en lamelles.", "Arrose de jus de citron et parsème de graines de courge."],
maquereau_lentilles: ["Rince les lentilles. Mets-les dans une casserole d'eau froide (3 fois leur volume) avec les carottes en rondelles et l'oignon émincé.", "Porte à ébullition puis laisse frémir 20 min. Sale seulement à la fin, sinon elles durcissent.", "Pendant ce temps, mélange dans un bol la moutarde, l'huile de colza, sel et poivre.", "Fais chauffer une poêle à feu vif avec une goutte d'huile. Pose les filets de maquereau côté peau, 3 à 4 min, puis 1 min de l'autre côté.", "Égoutte les lentilles, mélange-les à la vinaigrette et au persil ciselé, sers avec le maquereau."],
sardines_grill: ["Mets les pommes de terre entières (avec la peau) à cuire à la vapeur ou à l'eau salée, 20 min.", "Coupe les tomates en tranches et l'oignon rouge en fines lamelles. Dispose-les dans un plat avec huile d'olive, sel et basilic.", "Sèche les sardines avec du papier absorbant, sale-les.", "Fais-les cuire 3 min de chaque côté dans une poêle ou une plancha très chaude, sans les bouger avant de les retourner.", "Sers avec les pommes de terre coupées en deux et la salade de tomates."],
truite_amandes: ["Lance le riz complet : 2 volumes d'eau salée pour 1 de riz, 25 min à couvert à feu doux.", "Équeute les haricots verts et cuis-les 8 min à la vapeur ou à l'eau bouillante salée.", "Fais fondre le beurre dans une poêle à feu moyen. Mets la truite côté peau, 3 min, retourne, 2 min. Réserve-la sur les assiettes.", "Dans la même poêle, fais dorer les amandes effilées 1 min en remuant.", "Verse-les sur la truite avec le jus de citron. Sers avec le riz et les haricots."],
truite_soja: ["Lance le riz : rince-le, puis 1,5 volume d'eau pour 1 de riz, 12 min à couvert à feu doux.", "Préchauffe le four à 200 °C. Râpe le gingembre et l'ail, mélange-les avec la sauce soja et le miel.", "Pose la truite dans un plat, nappe-la de la moitié de la sauce, enfourne 8 min.", "Pendant ce temps, coupe les courgettes en demi-lunes et fais-les sauter 6 min à feu vif avec un peu d'huile.", "Arrose la truite du reste de sauce, parsème de sésame et sers avec le riz et les courgettes."],
truite_poireaux: ["Préchauffe le four à 200 °C. Coupe les poireaux en fines rondelles et rince-les bien.", "Fais-les fondre 8 min à feu moyen dans une poêle avec l'huile, sel et poivre.", "Sur une grande feuille de papier cuisson, pose les poireaux, la truite par-dessus et 2 rondelles de citron. Referme en papillote bien serrée.", "Enfourne 12 min.", "Pendant ce temps, rince le quinoa et cuis-le 12 min dans 2 volumes d'eau salée. Ouvre la papillote à table et parsème de ciboulette."],
maquereau_fenouil: ["Préchauffe le four à 200 °C.", "Coupe les pommes de terre en quartiers et le fenouil en 8 morceaux. Mélange-les sur une plaque avec l'huile, sel et poivre. Enfourne 25 min.", "Badigeonne la chair des filets de maquereau de moutarde.", "Pose-les sur les légumes, peau dessous, pour les 8 dernières minutes.", "Arrose de citron au moment de servir."],
maquereau_chou: ["Émince finement le chou rouge et l'oignon. Coupe la pomme en petits dés.", "Fais-les revenir 3 min dans une cocotte avec la moitié de l'huile, ajoute le vinaigre et un fond d'eau, couvre et laisse 20 min à feu doux en remuant de temps en temps. Sale en fin de cuisson.", "Pendant ce temps, cuis les pommes de terre à la vapeur, 20 min.", "Fais cuire les filets de maquereau côté peau dans une poêle chaude, 4 min, puis 1 min de l'autre côté.", "Sers le maquereau sur le chou, avec les pommes de terre."],
salade_sardines: ["Cuis les pommes de terre (en morceaux) et les haricots verts à l'eau bouillante salée : 15 min pour les pommes de terre, les haricots les 8 dernières minutes.", "En même temps, cuis les œufs 9 min dans l'eau bouillante, refroidis-les sous l'eau froide et écale-les.", "Coupe les tomates en quartiers et l'oignon rouge en lamelles. Lave la salade.", "Prépare une vinaigrette : huile, vinaigre, sel, poivre.", "Assemble le tout avec les sardines en morceaux et les œufs en quartiers. Ça se garde très bien pour le midi du lendemain."],
// --- Poisson maigre & fruits de mer
cabillaud_celeri: ["Épluche le céleri-rave et les pommes de terre, coupe-les en cubes. Cuis-les 20 min dans l'eau salée.", "Préchauffe le four à 180 °C. Pose le cabillaud dans un plat, sale, poivre, un filet d'huile si tu veux. Enfourne 10 min.", "Égoutte les légumes et écrase-les à la fourchette avec le lait chaud et le beurre. Rectifie le sel.", "Fais tomber les épinards 2 min dans une poêle chaude avec une pincée de sel.", "Sers le cabillaud sur la purée, avec les épinards et la ciboulette."],
merlu_printemps: ["Rince le riz et lance-le : 1,5 volume d'eau salée, 12 min à couvert.", "Casse le bout dur des asperges et coupe-les en tronçons.", "Mets asperges et petits pois dans le panier vapeur, 6 min.", "Ajoute le merlu salé dans un second panier (ou par-dessus) et compte encore 8 min.", "Arrose d'huile d'olive et de citron, sers avec le riz."],
curry_cabillaud: ["Lance le riz : 1,5 volume d'eau salée, 12 min à couvert.", "Émince l'oignon et râpe le gingembre. Fais-les revenir 3 min avec un peu d'huile et le curry, en remuant.", "Ajoute les tomates et le lait de coco, sale et laisse mijoter 10 min.", "Coupe le cabillaud en gros morceaux, plonge-les dans la sauce avec les épinards. Couvre et laisse 6 min à feu doux sans trop remuer pour ne pas casser le poisson.", "Sers sur le riz avec la coriandre."],
dorade_ratatouille: ["Préchauffe le four à 200 °C.", "Coupe courgette, aubergine, poivron et tomate en dés de 2 cm. Mélange-les sur une plaque avec l'huile, les herbes, sel et poivre.", "Enfourne 25 min en remuant à mi-cuisson.", "Pose les filets de dorade sur les légumes, sale, poivre, et remets 8 min.", "Pendant ce temps, verse la semoule dans un bol, couvre-la d'autant d'eau bouillante salée, couvre 5 min puis égraine à la fourchette."],
lieu_amandes: ["Épluche la patate douce, coupe-la en cubes et cuis-la 15 min à l'eau salée.", "Préchauffe le four à 200 °C. Concasse les amandes grossièrement (au couteau ou dans un sachet avec un rouleau).", "Pose le lieu dans un plat, sale, couvre-le d'amandes et d'un filet d'huile. Enfourne 12 min.", "Égoutte la patate douce et écrase-la avec un peu de son eau de cuisson.", "Assaisonne la mâche avec le citron et un filet d'huile, sers le tout ensemble."],
lieu_poireaux: ["Coupe les poireaux en fines rondelles et rince-les.", "Fais-les fondre dans une sauteuse avec le beurre et 3 c. à soupe d'eau, 12 min à couvert à feu doux. Sale.", "Pendant ce temps, cuis les pommes de terre à la vapeur, 20 min.", "Pose le lieu sur les poireaux, sale, poivre, couvre et laisse 8 min à feu doux.", "Arrose de citron et parsème de persil."],
moules: ["Préchauffe le four à 210 °C. Coupe les pommes de terre en quartiers, mélange-les avec l'huile et du sel sur une plaque, enfourne 30 min.", "Rince les moules à l'eau froide, retire les filaments et jette celles qui restent ouvertes quand tu les tapotes.", "Dans une grande cocotte, fais fondre l'échalote émincée 2 min avec un filet d'huile.", "Verse les moules, couvre, et laisse 5 à 6 min à feu vif en secouant la cocotte : elles sont prêtes quand elles sont toutes ouvertes.", "Parsème de persil, arrose de citron, sers avec les pommes de terre."],
wok_crevettes: ["Mets de l'eau à bouillir pour les nouilles.", "Coupe le poivron, la carotte et la courgette en fines lanières. Râpe le gingembre et l'ail.", "Plonge les nouilles 4 min dans l'eau bouillante, égoutte et passe-les sous l'eau froide.", "Dans un wok ou une grande poêle très chaude avec l'huile, saisis les légumes 4 min en remuant sans arrêt. Ajoute ail, gingembre et crevettes, 3 min : elles doivent être roses.", "Ajoute les nouilles, la sauce soja et le jus de citron vert, mélange 1 min et sers."],
merlu_basquaise: ["Lance le riz complet : 2 volumes d'eau salée, 25 min à couvert.", "Émince l'oignon et coupe les poivrons en lanières. Fais-les fondre 10 min dans une sauteuse avec l'huile.", "Ajoute les tomates en dés, l'ail écrasé, le piment d'Espelette et du sel. Laisse mijoter 10 min.", "Pose le merlu sur la sauce, couvre et laisse 8 min à feu doux.", "Sers avec le riz."],
poelee_crevettes: ["Rince le riz et lance-le : 1,5 volume d'eau salée, 12 min à couvert.", "Casse le bout dur des asperges et coupe-les en tronçons de 3 cm. Émince l'échalote.", "Dans une grande poêle avec l'huile, fais revenir échalote, asperges et petits pois 6 min à feu moyen.", "Ajoute les crevettes, sale, poivre, et laisse 3 min jusqu'à ce qu'elles soient roses.", "Arrose de citron, parsème de ciboulette et sers avec le riz."],
// --- Volaille
curry_poulet: ["Lance le riz : rince-le, puis 1,5 volume d'eau salée, 12 min à couvert à feu doux.", "Émince l'oignon et râpe le gingembre. Fais-les revenir 3 min dans une sauteuse avec un filet d'huile et le curry.", "Ajoute le poulet coupé en dés et fais-le dorer 5 min.", "Verse les tomates, le lait de coco et les pois chiches rincés. Sale et laisse mijoter 12 min à feu doux.", "Ajoute les épinards à la fin, mélange 1 min jusqu'à ce qu'ils tombent. Sers avec le riz."],
poulet_racines: ["Préchauffe le four à 200 °C.", "Épluche carottes et panais, coupe-les en gros tronçons. Coupe les pommes de terre en quartiers et l'oignon en 4.", "Mets tout dans un grand plat avec le poulet, les gousses d'ail entières, l'huile, les herbes, sel et poivre. Mélange avec les mains.", "Enfourne 45 min en retournant à mi-cuisson. Rien d'autre à faire pendant ce temps.", "C'est prêt quand les légumes sont tendres sous la pointe d'un couteau et le poulet bien doré."],
poulet_citron_boulgour: ["Idéalement le matin : coupe le poulet en lanières et mets-le au frigo avec le jus de citron, l'ail écrasé, la moitié de l'huile, sel et poivre.", "Le soir, verse le boulgour dans 2 volumes d'eau bouillante salée, 10 min à couvert hors du feu.", "Coupe les courgettes en tranches dans la longueur et fais-les griller 3 min par face dans une poêle chaude avec le reste d'huile.", "Dans la même poêle, fais cuire le poulet 5 min en le retournant.", "Sers avec la menthe ciselée."],
dinde_moutarde: ["Mets à bouillir une grande casserole d'eau salée. Cuis les pâtes le temps indiqué sur le paquet, et ajoute les haricots verts dans la même eau 8 min avant la fin.", "Coupe la dinde en lanières et émince l'échalote.", "Fais-les dorer 5 min dans une poêle avec l'huile. Sale, poivre.", "Hors du feu, ajoute le yaourt mélangé à la moutarde (hors du feu pour qu'il ne tourne pas).", "Égoutte pâtes et haricots, mélange avec la dinde et sa sauce."],
dinde_poireaux: ["Lance le riz complet : 2 volumes d'eau salée, 25 min à couvert.", "Coupe les poireaux en rondelles, rince-les et fais-les fondre 10 min dans une sauteuse avec l'huile et un fond d'eau.", "Ajoute la dinde coupée en lanières, sale, poivre, et laisse 5 min en remuant.", "Hors du feu, ajoute le yaourt mélangé à la moutarde.", "Sers avec le riz."],
tajine_poulet: ["Coupe le poulet en morceaux, émince l'oignon, coupe les carottes en rondelles épaisses.", "Dans une cocotte avec l'huile, fais dorer le poulet et l'oignon 5 min avec le ras el hanout.", "Ajoute carottes, pois chiches rincés, un verre d'eau et du sel. Couvre et laisse mijoter 35 min à feu doux.", "Pendant ce temps, prépare la semoule : autant d'eau bouillante salée que de semoule, 5 min à couvert, puis égraine.", "Arrose de citron et parsème de coriandre au moment de servir."],
poulet_basquaise: ["Coupe le poulet en morceaux, émince l'oignon et coupe les poivrons en lanières.", "Fais dorer le poulet 8 min dans une cocotte avec l'huile, puis réserve-le.", "Dans la même cocotte, fais fondre oignon et poivrons 8 min.", "Remets le poulet, ajoute les tomates en dés, l'ail, le piment d'Espelette et du sel. Couvre et laisse mijoter 25 min.", "Pendant ce temps, cuis le riz (1,5 volume d'eau salée, 12 min)."],
poulet_cacahuete: ["Lance le riz : 1,5 volume d'eau salée, 12 min à couvert.", "Prépare la sauce : mélange le beurre de cacahuète, la sauce soja, le jus de citron vert, le gingembre râpé et 3 c. à soupe d'eau chaude jusqu'à obtenir une crème lisse.", "Détaille le brocoli en bouquets et cuis-le 6 min à la vapeur.", "Coupe le poulet en dés et fais-le sauter 6 min à feu vif avec un filet d'huile.", "Mélange poulet et brocoli avec la sauce, sers sur le riz."],
canard_potimarron: ["Lave le potimarron (pas besoin de l'éplucher), retire les graines, coupe-le en cubes.", "Cuis-le 15 min à l'eau salée, égoutte et mixe-le ou écrase-le avec un peu d'eau de cuisson.", "Fais chauffer une poêle à feu vif. Saisis les aiguillettes de canard 2 min par face, sale, poivre.", "Ajoute le miel en fin de cuisson et retourne-les pour les enrober.", "Assaisonne la mâche avec l'huile de colza et les noix concassées, sers avec la purée et le canard."],
poulet_pistou: ["Mets l'eau des pâtes à bouillir avec du sel.", "Prépare le pistou : mixe le basilic, les amandes, l'ail, l'huile et une pincée de sel. Sans mixeur, hache tout très finement au couteau.", "Cuis les pâtes le temps indiqué sur le paquet.", "Pendant ce temps, coupe le poulet en dés et fais-le dorer 6 min dans une poêle. Coupe les tomates cerises en deux.", "Égoutte les pâtes, mélange-les avec le pistou, le poulet et les tomates."],
bouillon_poulet: ["Coupe carottes, poireau et navet en morceaux. Coupe le gingembre en rondelles.", "Mets le poulet et les légumes dans une grande casserole, couvre d'eau froide (1 L pour 2), sale.", "Porte à ébullition puis laisse frémir 35 min à petit feu, sans couvrir complètement.", "Sors le poulet et effiloche-le avec deux fourchettes.", "Remets-le dans le bouillon, ajoute les pâtes fines et cuis 5 min. Parsème de persil."],
poulet_paprika_quinoa: ["Rince le quinoa et cuis-le 12 min dans 2 volumes d'eau salée. Égoutte et passe-le sous l'eau froide.", "Coupe les tomates et le concombre en petits dés, cisèle la menthe.", "Mélange le quinoa, les légumes, la menthe, le jus de citron, la moitié de l'huile, sel et poivre.", "Coupe le poulet en lanières, saupoudre de paprika et de sel.", "Fais-le cuire 6 min dans une poêle chaude avec le reste d'huile, sers sur la salade. Se garde très bien pour le midi."],
poulet_tandoori: ["Mélange les deux tiers du yaourt avec le curry, le paprika, le gingembre râpé, l'ail écrasé et du sel.", "Coupe le poulet en gros morceaux et enrobe-le de cette marinade (le matin, c'est encore meilleur).", "Préchauffe le four à 220 °C, étale le poulet sur une plaque et enfourne 20 min.", "Pendant ce temps, cuis le riz (1,5 volume d'eau salée, 12 min). Râpe le concombre et mélange-le au reste du yaourt avec le citron et du sel : c'est la raïta.", "Sers le poulet avec le riz et la raïta bien fraîche."],
poulet_chou_fleur: ["Préchauffe le four à 200 °C.", "Détaille chou-fleur et brocoli en bouquets, coupe les pommes de terre en cubes. Cuis-les 8 min à la vapeur.", "Coupe le poulet en dés et fais-le dorer 5 min dans une poêle avec l'huile, sale.", "Mets le tout dans un plat, verse le lait et parsème de comté râpé.", "Enfourne 15 min, jusqu'à ce que le dessus soit doré."],
// --- Viande rouge & porc
boeuf_carottes: ["Coupe le bœuf en cubes de 4 cm, émince l'oignon, coupe les carottes en rondelles épaisses.", "Dans une cocotte avec l'huile, fais dorer le bœuf sur toutes les faces à feu vif, en deux fois si besoin.", "Ajoute l'oignon, l'ail, les tomates, les herbes, du sel, et de l'eau à hauteur.", "Couvre et laisse mijoter 2 h à feu très doux. Ajoute les carottes au bout d'1 h. Tu n'as rien à faire pendant ce temps.", "20 min avant la fin, cuis les pommes de terre à la vapeur. C'est prêt quand la viande se coupe à la fourchette."],
chili: ["Lance le riz complet : 2 volumes d'eau salée, 25 min à couvert.", "Émince l'oignon et coupe le poivron en dés. Fais-les revenir 5 min dans une cocotte avec un filet d'huile.", "Ajoute le bœuf haché, émiette-le avec une cuillère et fais-le dorer 5 min. Ajoute cumin, paprika et sel.", "Verse les tomates et les haricots rouges rincés, laisse mijoter 20 min à feu doux en remuant de temps en temps.", "Sers avec le riz. Encore meilleur réchauffé le lendemain midi."],
rumsteck: ["Sors la viande du frigo 20 min avant pour qu'elle cuise mieux.", "Coupe les pommes de terre en cubes, précuis-les 8 min dans l'eau salée, égoutte.", "Fais-les dorer 12 min dans une poêle avec 1 c. à soupe d'huile, en remuant. Sale.", "Dans une autre poêle très chaude, saisis le rumsteck 2 à 3 min par face (saignant à point). Sale, poivre, laisse reposer 3 min sur une assiette.", "Pendant le repos, assaisonne la salade avec l'échalote émincée, le vinaigre et le reste d'huile."],
bolognaise: ["Coupe l'oignon et la carotte en tout petits dés.", "Fais-les fondre 8 min dans une sauteuse avec l'huile.", "Ajoute le bœuf haché, émiette-le et fais-le dorer 5 min. Ajoute les tomates, l'ail écrasé, du sel, et laisse mijoter 20 min à feu doux.", "Pendant ce temps, cuis les spaghetti dans une grande casserole d'eau salée, le temps indiqué sur le paquet.", "Égoutte, sers avec la sauce et quelques feuilles de basilic."],
boulettes_agneau: ["Préchauffe le four à 200 °C.", "Râpe l'oignon. Mélange-le à l'agneau haché avec le cumin, la moitié de la menthe ciselée et du sel.", "Façonne des boulettes de la taille d'une noix avec les mains mouillées, pose-les sur une plaque et enfourne 12 min.", "Pendant ce temps, verse le boulgour dans 2 volumes d'eau bouillante salée, 10 min à couvert.", "Pour la sauce, mélange le yaourt, le concombre râpé, le reste de menthe et du sel. Sers le tout ensemble."],
filet_mignon: ["Préchauffe le four à 190 °C.", "Épluche la patate douce et coupe-la en gros cubes. Coupe la pomme et l'oignon en quartiers.", "Fais dorer le filet mignon sur toutes ses faces dans une poêle avec l'huile, 4 min. Sale, poivre.", "Mets-le dans un plat entouré de patate douce, pomme et oignon, enfourne 25 min.", "Pendant ce temps, cuis les choux de Bruxelles coupés en deux 10 min à la vapeur, puis fais-les dorer 3 min à la poêle. Coupe le filet en tranches."],
porc_chou: ["Lance le riz : 1,5 volume d'eau salée, 12 min à couvert.", "Coupe le porc en fines lanières, émince le chou, coupe la carotte en bâtonnets. Râpe le gingembre et l'ail.", "Dans une grande poêle très chaude avec l'huile, saisis le porc 4 min, réserve.", "Mets le chou et la carotte, fais-les sauter 6 min à feu vif.", "Remets le porc avec ail, gingembre et sauce soja, mélange 1 min et sers avec le riz."],
parmentier: ["Épluche les pommes de terre, coupe-les en morceaux et cuis-les 20 min à l'eau salée.", "Pendant ce temps, émince l'oignon et râpe la carotte. Fais-les revenir 5 min avec un filet d'huile, ajoute le bœuf haché, sale et laisse 5 min.", "Préchauffe le four à 200 °C.", "Écrase les pommes de terre avec le lait chaud et le beurre.", "Mets la viande au fond d'un plat, la purée par-dessus, et enfourne 20 min. Sers avec la salade."],
navarin: ["Coupe l'agneau en morceaux, émince l'oignon.", "Dans une cocotte, fais dorer l'agneau 5 min avec un filet d'huile. Ajoute l'oignon, les tomates, du sel et de l'eau à hauteur.", "Couvre et laisse mijoter 1 h à feu doux.", "Épluche navets, carottes et pommes de terre, coupe-les en morceaux et ajoute-les. Laisse encore 25 min.", "Ajoute les petits pois pour les 5 dernières minutes."],
boeuf_poivrons: ["Verse la semoule dans un bol, couvre-la d'autant d'eau bouillante salée, couvre 5 min puis égraine.", "Coupe le poivron, la courgette et l'oignon rouge en lanières. Coupe le bœuf en fines lanières.", "Dans une grande poêle très chaude avec l'huile, fais sauter les légumes 6 min.", "Ajoute le bœuf et le cumin, sale, et laisse seulement 2 min pour qu'il reste tendre.", "Sers avec la semoule."],
cassoulet: ["Préchauffe le four à 160 °C.", "Dans une cocotte qui va au four, fais dorer la saucisse coupée en tronçons et le poulet, 8 min.", "Ajoute l'oignon émincé, la carotte en rondelles, l'ail, les tomates et les herbes, 3 min.", "Ajoute les haricots rincés et de l'eau juste à hauteur. Enfourne 1 h 30 sans couvercle.", "Deux fois pendant la cuisson, enfonce la croûte qui se forme avec une cuillère. C'est prêt quand le dessus est bien doré."],
nouilles_boeuf: ["Mets de l'eau à bouillir. Plonge les nouilles 4 min, égoutte et passe-les sous l'eau froide.", "Râpe la carotte, émince finement le chou, râpe le gingembre. Coupe le bœuf en très fines lanières.", "Dans une grande poêle très chaude avec l'huile, fais sauter carotte et chou 5 min.", "Ajoute le bœuf, le gingembre et la sauce soja, 2 min.", "Ajoute les nouilles, mélange, et sers avec la coriandre et le citron vert."],
potimarron_farci: ["Préchauffe le four à 200 °C. Coupe le potimarron en deux, retire les graines.", "Pose les moitiés face coupée vers le haut sur une plaque, enfourne 25 min.", "Pendant ce temps, cuis le riz complet (25 min) et fais revenir l'oignon émincé avec le bœuf haché 5 min. Ajoute les tomates, sale, 5 min.", "Mélange la viande et le riz, remplis les moitiés de potimarron.", "Parsème de comté et remets 15 min au four."],
// --- Légumineuses
dahl: ["Rince les lentilles corail jusqu'à ce que l'eau soit claire.", "Émince l'oignon, râpe le gingembre. Fais-les revenir 3 min dans une casserole avec un filet d'huile et le curry.", "Ajoute les lentilles, les tomates, le lait de coco et 2 fois le volume des lentilles en eau. Sale.", "Laisse mijoter 18 min en remuant de temps en temps : les lentilles doivent fondre. Pendant ce temps, cuis le riz (1,5 volume d'eau, 12 min).", "Ajoute les épinards à la fin, 1 min, et sers avec le riz et la coriandre."],
curry_pois_chiches: ["Lance le riz : 1,5 volume d'eau salée, 12 min à couvert.", "Émince l'oignon et fais-le revenir 3 min avec un filet d'huile et le curry.", "Ajoute la patate douce épluchée en petits dés, les tomates, le lait de coco et un demi-verre d'eau. Sale, couvre, 15 min.", "Ajoute les pois chiches rincés, 5 min.", "Ajoute les épinards à la fin, mélange jusqu'à ce qu'ils tombent, sers avec le riz."],
chili_sin_carne: ["Lance le riz complet : 2 volumes d'eau salée, 25 min à couvert.", "Émince l'oignon et coupe le poivron en dés. Fais-les revenir 5 min avec un filet d'huile, le cumin et le paprika.", "Ajoute les lentilles rincées, les tomates et un verre d'eau. Sale et laisse mijoter 20 min.", "Ajoute les haricots rouges rincés, 10 min.", "Sers avec le riz et l'avocat en tranches."],
taboule_pois_chiches: ["Verse le boulgour dans 2 volumes d'eau bouillante salée, couvre 10 min, puis égraine et laisse refroidir.", "Rince les pois chiches et fais-les dorer 5 min à la poêle avec le cumin et une pincée de sel.", "Coupe tomates, concombre et oignon rouge en petits dés. Cisèle persil et menthe.", "Mélange le boulgour, les légumes, les herbes, le jus de citron et un filet d'huile si tu veux.", "Sauce : mélange le tahini, un peu de citron et d'eau jusqu'à ce qu'elle soit lisse. Verse sur les pois chiches."],
lentilles_oeuf: ["Rince les lentilles et cuis-les 20 min dans 3 volumes d'eau. Sale à la fin et égoutte.", "Cuis les œufs 6 min dans l'eau bouillante (jaune coulant), passe-les sous l'eau froide et écale-les.", "Vinaigrette : moutarde, vinaigre, huile de colza, échalote émincée, sel, poivre.", "Mélange les lentilles tièdes avec la vinaigrette et la betterave en dés.", "Sers sur la mâche, avec l'œuf ouvert par-dessus et les noix concassées."],
minestrone: ["Coupe carotte, courgette, poireau et oignon en petits dés.", "Fais-les revenir 5 min dans une grande casserole avec un filet d'huile.", "Ajoute les tomates et 4 fois leur volume d'eau. Sale et laisse frémir 20 min.", "Ajoute les haricots rincés et les petites pâtes, cuis 8 min.", "Sers avec le basilic et un peu de comté râpé."],
garbure: ["Coupe carottes, navets, poireau et pommes de terre en morceaux.", "Mets-les dans une grande casserole avec le poulet et l'ail, couvre d'eau, sale.", "Laisse frémir 30 min.", "Ajoute le chou émincé et les haricots rincés, encore 20 min.", "Effiloche le poulet dans la soupe. Elle doit être épaisse : écrase quelques légumes si besoin."],
soupe_lentilles: ["Émince l'oignon et coupe les carottes en rondelles.", "Fais revenir l'oignon 3 min dans une casserole avec un filet d'huile et le cumin.", "Ajoute carottes, lentilles corail rincées et 4 fois leur volume d'eau. Sale, laisse 20 min.", "Mixe la soupe (ou écrase-la au presse-purée), ajoute le lait de coco et le citron.", "Sers avec le pain complet grillé."],
patate_douce_farcie: ["Préchauffe le four à 200 °C. Lave les patates douces, pique-les à la fourchette et enfourne-les entières 40 min.", "Pendant ce temps, rince les haricots rouges et chauffe-les 5 min dans une petite casserole avec le cumin et du sel.", "Coupe l'avocat en dés et arrose-le de citron vert.", "Ouvre les patates douces en deux et écrase un peu la chair.", "Garnis de haricots, avocat, une cuillère de yaourt et la coriandre."],
couscous_legumes: ["Coupe carottes et navets en gros tronçons, émince l'oignon.", "Dans une grande casserole avec l'huile, fais revenir l'oignon 3 min avec le ras el hanout.", "Ajoute carottes, navets, tomates et 1 L d'eau. Sale et laisse 20 min.", "Ajoute la courgette en tronçons et les pois chiches rincés, 10 min.", "Prépare la semoule (autant d'eau bouillante salée, 5 min à couvert) et sers avec les légumes et leur bouillon."],
butternut_soupe: ["Épluche la courge, retire les graines et coupe-la en cubes. Émince l'oignon.", "Mets-les dans une casserole, couvre d'eau à peine, sale et laisse cuire 20 min.", "Pendant ce temps, cuis les œufs 6 min, passe-les sous l'eau froide et écale-les. Préchauffe le four à 200 °C.", "Pose le comté en lamelles sur les tranches de pain, 5 min au four.", "Mixe la soupe avec le lait de coco. Sers avec les graines de courge, l'œuf et les tartines."],
// --- Œufs & végétarien
chakchouka: ["Émince l'oignon et coupe les poivrons en lanières.", "Fais-les fondre 10 min dans une grande poêle avec l'huile.", "Ajoute les tomates en dés, le cumin et du sel, laisse 10 min.", "Creuse des petits puits dans la sauce et casse un œuf dans chacun. Couvre et laisse 6 min à feu doux : le blanc doit être pris, le jaune encore coulant.", "Parsème de coriandre et sers avec le pain complet."],
tortilla: ["Épluche les pommes de terre et coupe-les en fines tranches. Émince l'oignon.", "Fais-les cuire doucement 15 min dans une poêle avec l'huile, à couvert, en remuant : elles doivent être tendres, pas grillées.", "Bats les œufs avec du sel, ajoute les pommes de terre et l'oignon.", "Remets dans la poêle, 8 min à feu doux. Pose une assiette sur la poêle, retourne la tortilla dessus, puis fais-la glisser dans la poêle pour cuire l'autre face 3 min.", "Sers avec la salade. Elle se mange aussi froide le lendemain."],
oeufs_cocotte: ["Préchauffe le four à 180 °C.", "Fais tomber les épinards 2 min dans une poêle avec l'huile et une pincée de sel.", "Répartis-les dans des ramequins ou un petit plat, et casse les œufs par-dessus.", "Parsème de comté râpé, enfourne 10 min : le blanc doit être pris, le jaune encore coulant.", "Sers avec le pain grillé (pour tremper) et la salade."],
frittata: ["Coupe la courgette, le poivron et l'oignon en petits dés.", "Fais-les sauter 8 min dans une poêle qui va au four, avec un filet d'huile. Sale.", "Bats les œufs avec le comté râpé et le basilic, verse sur les légumes.", "Couvre et laisse cuire 10 min à feu doux.", "Passe 3 min sous le grill du four pour dorer le dessus. Sers avec le pain."],
carbo_courgettes: ["Mets l'eau des pâtes à bouillir avec du sel.", "Coupe les courgettes en fines demi-lunes et fais-les dorer 8 min dans une poêle avec l'huile.", "Bats les œufs avec le comté râpé et beaucoup de poivre.", "Cuis les pâtes, garde une louche d'eau de cuisson et égoutte.", "Hors du feu, mélange les pâtes aux courgettes, puis verse les œufs et un peu d'eau de cuisson en remuant vite : la sauce devient crémeuse sans cuire les œufs."],
// --- Déjeuners
bowl_quinoa: ["Si ce n'est pas fait, cuis le quinoa 12 min dans 2 volumes d'eau salée. Il se garde 3 jours au frigo.", "Rince et sèche les pois chiches, fais-les dorer 5 min à la poêle avec le paprika et une pincée de sel.", "Râpe la carotte. Coupe l'avocat en tranches et arrose-le de citron.", "Assemble le quinoa, les pois chiches, la carotte et l'avocat dans un bol.", "Arrose d'huile et de citron, parsème de graines de courge."],
salade_lentilles_oeufs: ["La veille : cuis les lentilles 20 min dans 3 volumes d'eau, sale et égoutte.", "Cuis les œufs 9 min, passe-les sous l'eau froide et écale-les.", "Coupe les tomates en dés, émince l'échalote, cisèle le persil.", "Mélange tout avec l'huile de colza, le vinaigre, sel et poivre.", "Ajoute les œufs coupés en quartiers."],
pates_sardines: ["Mets l'eau des pâtes à bouillir avec du sel et cuis les pâtes.", "Pendant ce temps, fais revenir l'ail écrasé 1 min dans une poêle avec l'huile, ajoute les tomates et laisse 8 min.", "Ajoute les sardines égouttées en morceaux, 2 min sans trop remuer.", "Râpe un peu de zeste de citron et presse le jus.", "Mélange les pâtes égouttées avec la sauce, le persil et le citron."],
tartines_oeufs: ["Fais griller le pain.", "Bats les œufs avec une pincée de sel. Cuis-les à feu doux dans une poêle en remuant sans arrêt, 3 min : ils doivent rester crémeux.", "Écrase l'avocat à la fourchette avec un peu de sel.", "Tartine l'avocat sur le pain, pose les œufs par-dessus.", "Sers avec les tomates et les radis."],
riz_saute: ["Le plus simple avec du riz cuit la veille. Sinon, cuis-le 12 min et étale-le pour qu'il refroidisse.", "Émince l'oignon, coupe la carotte en petits dés.", "Fais-les sauter 4 min dans une grande poêle chaude avec l'huile, ajoute les petits pois 2 min.", "Ajoute le riz et fais-le sauter 3 min.", "Pousse le riz sur le côté, casse les œufs dans la poêle, brouille-les puis mélange tout avec la sauce soja."],
salade_pates_poulet: ["La veille : cuis les pâtes, rince-les à l'eau froide. Cuis le poulet 6 min à la poêle et coupe-le en dés.", "Coupe les tomates cerises en deux.", "Mélange pâtes, poulet, tomates et roquette.", "Assaisonne avec l'huile, le vinaigre, sel, poivre et le basilic.", "Mets dans ta boîte, ça se mange froid."],
salade_poulet_carottes: ["Cuis le poulet la veille, en même temps que le dîner : 6 min à la poêle, puis coupe-le en tranches.", "Râpe les carottes, lave la salade.", "Mélange le yaourt avec le jus de citron, sel et poivre.", "Assemble poulet, carottes et salade, nappe de sauce.", "Sers avec le pain complet."],
salade_maquereau: ["La veille : cuis les pommes de terre 20 min à l'eau salée et laisse-les refroidir.", "Coupe-les en rondelles, coupe le concombre en dés et l'oignon rouge en lamelles.", "Mélange le yaourt avec la moutarde, sel et poivre.", "Ajoute le maquereau égoutté en morceaux.", "Mélange tout délicatement et parsème de ciboulette."],
houmous_assiette: ["Rince les pois chiches. Mixe-les avec le tahini, le jus de citron, le cumin, une pincée de sel et 3 à 4 c. à soupe d'eau, jusqu'à ce que ce soit lisse. Il se garde 4 jours.", "Cuis les œufs 9 min, passe-les sous l'eau froide et écale-les.", "Coupe la carotte et le concombre en bâtonnets.", "Dispose le houmous, les crudités, les œufs et le pain dans ton assiette ou ta boîte.", "Trempe les crudités et le pain dans le houmous."],
taboule_poulet: ["Verse le boulgour dans 2 volumes d'eau bouillante salée, couvre 10 min, égraine et laisse refroidir.", "Cuis le poulet 6 min à la poêle (ou utilise celui de la veille) et coupe-le en dés.", "Coupe tomates et concombre en petits dés, cisèle menthe et persil.", "Mélange tout avec le jus de citron, l'huile, sel et poivre.", "Laisse reposer au frais : il est encore meilleur après quelques heures."],
omelette_epinards: ["Fais tomber les épinards 2 min dans une poêle chaude avec l'huile.", "Bats les œufs avec le comté râpé et une pincée de sel.", "Verse-les sur les épinards, à feu moyen.", "Quand les bords prennent (2 à 3 min), plie l'omelette en deux.", "Sers avec le pain et la salade."],
veloute_oeufs: ["Coupe le poireau, la pomme de terre et la carotte en morceaux. Prépares-en pour 4 jours.", "Couvre d'eau, sale et cuis 20 min, puis mixe.", "Cuis les œufs 9 min, passe-les sous l'eau froide et écale-les.", "Pose le comté en lamelles sur le pain et passe-le 5 min au four ou au grille-pain.", "Réchauffe une portion de velouté et sers avec la tartine et les œufs."],
poke_maquereau: ["Cuis le riz la veille (1,5 volume d'eau salée, 12 min) ou utilise un reste.", "Coupe le concombre et l'avocat en dés, râpe la carotte.", "Égoutte le maquereau et émiette-le.", "Dispose le riz, le maquereau et les légumes dans un bol.", "Arrose de sauce soja et parsème de sésame."],
salade_pois_chiches: ["Cuis les œufs 9 min, passe-les sous l'eau froide et écale-les.", "Rince les pois chiches. Coupe le poivron en dés et l'oignon rouge en lamelles fines.", "Cisèle le persil.", "Mélange tout avec le cumin, le jus de citron, l'huile, sel et poivre.", "Ajoute les œufs en quartiers."],
mealprep_patate: ["Préchauffe le four à 200 °C. Prépare deux portions d'un coup pour deux midis.", "Épluche la patate douce et coupe-la en cubes. Coupe le poulet en morceaux.", "Mets-les sur une plaque avec l'huile, le paprika et du sel, enfourne 15 min.", "Ajoute le brocoli en bouquets et remets 10 min.", "Laisse refroidir et répartis dans tes boîtes."],
soupe_corail_yaourt: ["Prépare la soupe à l'avance : fais revenir l'oignon émincé avec le cumin, ajoute les carottes en rondelles, les lentilles rincées et 4 fois leur volume d'eau.", "Sale et cuis 20 min, puis mixe.", "Elle se garde 4 jours au frigo.", "Réchauffe une portion.", "Sers avec le pain complet et le yaourt grec."],
salade_riz_crevettes: ["Cuis le riz complet la veille (2 volumes d'eau salée, 25 min) et laisse-le refroidir.", "Fais sauter les crevettes 3 min dans une poêle chaude avec l'huile, sale.", "Coupe le poivron et l'avocat en dés.", "Mélange le riz, les crevettes et les légumes avec le jus de citron vert.", "Parsème de coriandre."],
bowl_hiver: ["Préchauffe le four à 200 °C. Coupe la courge en cubes, mélange-la avec la moitié de l'huile et du sel, enfourne 25 min.", "Pendant ce temps, cuis les lentilles 20 min dans 3 volumes d'eau, et le sarrasin 10 min dans 2 volumes d'eau salée.", "Prépare une vinaigrette avec le reste d'huile de colza, le vinaigre, sel et poivre.", "Assemble sarrasin, lentilles, courge et mâche.", "Arrose de vinaigrette et ajoute les noix."],
pates_brocoli: ["Mets l'eau des pâtes à bouillir avec du sel. Détaille le brocoli en petits bouquets.", "Cuis les pâtes, et ajoute le brocoli dans la même eau 5 min avant la fin.", "En même temps, cuis les œufs 6 min, passe-les sous l'eau froide et écale-les.", "Dans une poêle, fais dorer l'ail émincé et les amandes concassées 2 min dans l'huile.", "Mélange avec les pâtes et le brocoli égouttés, ajoute les œufs ouverts par-dessus."],
gaspacho: ["Coupe les tomates, le concombre et le poivron en morceaux.", "Mixe-les avec l'ail, l'huile, du sel et un peu d'eau froide si c'est trop épais.", "Mets au frais au moins 30 min (ou la veille).", "Cuis les œufs 9 min, passe-les sous l'eau froide et écale-les.", "Sers le gaspacho bien froid avec les tartines d'avocat écrasé et les œufs en tranches."],
chou_fleur_curry: ["Préchauffe le four à 200 °C.", "Détaille le chou-fleur en bouquets, rince les pois chiches.", "Mélange-les sur une plaque avec l'huile, le curry et du sel, enfourne 25 min.", "Pendant ce temps, cuis le riz (1,5 volume d'eau salée, 12 min).", "Sers avec une bonne cuillère de yaourt grec."],
steak_hache: ["Coupe les pommes de terre en morceaux et cuis-les à la vapeur avec les haricots verts, 15 à 20 min.", "Fais chauffer une poêle à feu vif avec l'huile.", "Cuis le steak 2 à 3 min par face. Le haché doit être bien cuit à cœur.", "Sale et poivre après cuisson.", "Sers avec les pommes de terre et les haricots."],
// --- Petits-déjeuners
porridge: ["Verse les flocons et le lait dans une casserole.", "Chauffe à feu doux 4 min en remuant, jusqu'à ce que ce soit crémeux.", "Verse dans un bol.", "Ajoute la banane en rondelles et le beurre de cacahuète.", "Saupoudre de cannelle."],
oeufs_tartines: ["Fais griller le pain.", "Bats les œufs avec une pincée de sel.", "Fais fondre le beurre dans une poêle à feu doux, verse les œufs et remue sans arrêt 3 min.", "Sers sur le pain.", "Accompagne de deux kiwis."],
yaourt_bowl: ["La veille, sors les fruits rouges du congélateur et mets-les au frigo.", "Verse le yaourt dans un bol.", "Ajoute les flocons et les fruits rouges.", "Parsème de noix concassées.", "Ajoute un filet de miel."],
smoothie: ["Cuis l'œuf dur à l'avance (9 min) pour la semaine.", "Mets la banane en morceaux, les flocons, le lait et le beurre de cacahuète dans le blender.", "Mixe 30 secondes jusqu'à ce que ce soit lisse.", "Verse dans un grand verre ou une gourde.", "Bois-le avec l'œuf dur, juste après la séance."],
pancakes: ["Mixe les flocons, la banane et les œufs jusqu'à obtenir une pâte lisse.", "Fais chauffer une poêle antiadhésive à feu moyen avec quelques gouttes d'huile.", "Verse de petites louches de pâte.", "Retourne quand des bulles apparaissent, environ 2 min par face.", "Sers avec les fruits rouges et un filet de miel."],
tartine_cacahuete: ["Fais griller le pain si tu veux.", "Tartine le beurre de cacahuète.", "Ajoute la banane en rondelles par-dessus.", "Sers avec un grand verre de lait.", ""],
overnight: ["La veille au soir, mélange les flocons, le lait et le yaourt dans un bocal.", "Ferme et mets au frigo toute la nuit.", "Le matin, râpe la pomme par-dessus.", "Ajoute les noix concassées et la cannelle.", "Mélange et mange froid."],
chocolatine: ["Achète la chocolatine chez un vrai boulanger (pur beurre).", "Verse le yaourt grec dans un bol.", "Croque la pomme à côté : le yaourt et le fruit apportent les protéines et les fibres qui manquent à la viennoiserie."],
// --- Goûters
c_amandes_pomme: ["Une poignée d'amandes (30 g, environ 25 amandes) et une pomme. À glisser dans ton sac le matin."],
c_yaourt_noix: ["Verse le yaourt grec dans un bol, ajoute le miel et les noix concassées."],
c_tartine: ["Tartine le beurre de cacahuète sur une tranche de pain complet."],
c_oeufs: ["Cuis plusieurs œufs durs d'un coup (9 min) pour la semaine : ils se gardent 5 jours au frigo dans leur coquille.", "Coupe la carotte en bâtonnets."],
c_banane_choco: ["Une banane, une poignée de noix et deux carrés de chocolat noir."],
c_smoothie: ["Mixe le lait, la banane et les flocons 30 secondes."],
c_comte_poire: ["Coupe le comté en lamelles, sers avec le pain et la poire."],
c_dattes: ["Quelques dattes (dénoyautées) et une poignée d'amandes."],
c_yaourt_fraises: ["Coupe les fraises, mets-les sur le yaourt grec et parsème de graines de courge."],
c_clementines: ["Deux clémentines et une poignée d'amandes."]

    const P = pk(k);
    for (const l of CACHE.pan[k]) {
      if (l.q <= 1e-6 || l.exp > d) continue;
      if (P.size ? l.q < 0.04 * P.size : l.q < 5) { l.q = 0; continue; }
      const R = P.res && !l.fz ? RESCUE[P.res] : null;
      if (R && l.q <= R.cap) { day.notes.push({ k, q: l.q, kind: "eat", how: R.how }); day.th.push([k, l.q * R.part]); l.q = 0; }
      else if (P.f && !l.fz) { day.notes.push({ k, q: l.q, kind: "freeze" }); l.fz = true; l.exp = d + 150; }
      else { CACHE.waste.push({ dn: d, k, q: l.q }); day.notes.push({ k, q: l.q, kind: "waste" }); l.q = 0; }
    }
    CACHE.pan[k] = CACHE.pan[k].filter(l => l.q > 1e-6);
  }

}
function ensure(dn) { if (!CACHE) resetCache(); while (CACHE.days.length <= dn - EPOCH) simDay(EPOCH + CACHE.days.length); }
function resolve(dn) { if (dn < EPOCH) dn = EPOCH; ensure(dn); return CACHE.days[dn - EPOCH]; }

function weekStats(days) {
  let fish = 0, oily = 0, leg = 0, red = 0, flp = 0, k = 0, p = 0;
  const plants = new Set();
  days.forEach(d => {
    [d.l, d.d].forEach(r => {
      if (!r) return;
      if (r.cat === "pg" || r.cat === "pm") fish++;
      if (r.cat === "pg") oily++;
      if (isLegume(r)) leg++;
      red += redGrams(r) * S.fT;
    });
    d.th.forEach(([key, q]) => {
      const i = ING[key];
      if (i.v) plants.add(key);
      if ((i.r === "fl" || i.r === "su") && key !== "pdt" && key !== "patate_douce") flp += i.u === "g" ? q / 80 : (i.w || 0) * q / 80;
    });
    k += d.kcal; p += d.prot;
  });

}

/* ============ Courses ============ */
function courseFor(dn) {
  const sd = shopDays();
  let a = dn; while (!sd.includes(wdOf(a))) a--;
  let b = a + 1; while (!sd.includes(wdOf(b))) b++;
  let x = a - 1; while (!sd.includes(wdOf(x))) x--;
  return { dn: a, from: a, to: b - 1, next: b, prev: x };
}

function storeOf(i) {
  if (S.where && S.where[i.k] === "autre") return "autre";
  if (i.s) return "placard";
  if (i.r === "bo") return S.meatAt === "boucher" ? "boucher" : "magasin";
  if (i.r === "po") return S.fishAt === "poissonnier" ? "poissonnier" : "magasin";
  if (i.r === "pa") return "boulangerie";
  return "magasin";
}
function keepDays(k) { const i = ING[k]; if (i.r === "po" || HACHE.includes(k)) return 1; if (["poulet_filet", "poulet_cuisse", "dinde", "canard"].includes(k)) return 2; return 3; }
/* Ce qu'il faut acheter : uniquement ce qui manque au frigo ou au placard, en paquets entiers */
function shopList(from, to, buyDn) {
  ensure(to);
  const items = {};
  for (let dn = Math.max(from, EPOCH); dn <= to; dn++) {
    CACHE.days[dn - EPOCH].buy.forEach(b => {
      const it = items[b.k] || (items[b.k] = { k: b.k, n: 0, q: 0, uses: [] });
      if (b.n) it.n += b.n; else it.q += b.q;
      if (!it.uses.some(u => u.dn === dn && u.slot === b.slot)) it.uses.push({ dn, slot: b.slot });
    });
  }
  return Object.values(items).map(it => {
    const late = ING[it.k].r === "bo" || ING[it.k].r === "po" ? it.uses.filter(u => u.dn - buyDn > keepDays(it.k)) : [];
    it.hint = late.length ? "Congèle la part de " + [...new Set(late.map(u => fmtDate(u.dn, { short: true, noMonth: true })))].join(", ") : "";
    return it;
  });
}
function fmtBuy(it) {
  const P = pk(it.k);
  if (it.n) return P.sg ? it.n + " " + (it.n > 1 ? P.pl : P.sg) : String(it.n);
  return fmtQ(it.k, it.q);
}
function fmtQ(k, q) {
  const i = ING[k];
  if (i.u === "g") { if (q >= 1000) return (Math.ceil(q / 100) / 10).toLocaleString("fr-FR") + " kg"; const s = q > 200 ? 50 : 10; return Math.ceil(q / s) * s + " g"; }
  if (i.u === "ml") { if (q >= 1000) return (Math.ceil(q / 100) / 10).toLocaleString("fr-FR") + " L"; return Math.ceil(q / 50) * 50 + " ml"; }
  if (i.u === "pc") return String(Math.max(1, Math.ceil(q - 0.15)));
  if (i.u === "cs") return "≈ " + Math.max(1, Math.round(q)) + " c. à s.";
  return "≈ " + Math.max(1, Math.round(q)) + " c. à c.";
}
function noteText(n) {
  const name = ING[n.k].n, q = fmtRecipeQ(n.k, n.q);
  if (n.kind === "eat") return `${name} (${q}) ${n.how}`;
  if (n.kind === "freeze") return `congèle le reste de ${name} (${q})`;
  return `${name} (${q}) à jeter`;
}
function fmtRecipeQ(k, q) {
  const i = ING[k];
  const frac = v => { const r = Math.round(v * 4) / 4; const w = Math.floor(r), f = r - w; const fs = f === 0.25 ? "¼" : f === 0.5 ? "½" : f === 0.75 ? "¾" : ""; return (w || !fs ? String(w) : "") + fs; };

  return frac(Math.max(0.25, q)) + (i.u === "cs" ? " c. à soupe" : " c. à café");
}

<script>

/* ---- Partage en direct entre Anna et toi ----

const SH = { connecting: true, live: false, slow: false, readonly: false, checks: {}, checkDocs: new Set(), missing: [], planInit: false };

const sameJSON = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function pushPlan() {

async function startSync() {

}
function syncBadge() {
  if (SH.connecting) return `<span class="sync">Connexion…</span>`;
  if (!SH.live) return `<span class="sync off">Enregistré sur cet appareil seulement</span>`;
  if (SH.slow) return `<span class="sync off">Connexion lente : tes changements partent dès que possible</span>`;
  return `<span class="sync on">Partagé en direct avec Anna${SH.readonly ? " · lecture seule" : ""}</span>`;
}

/* Cases cochées des courses */
function checkOf(c, k) { if (SH.live) { const v = SH.checks[c] && SH.checks[c][k]; return v || null; } return CHK[c] && CHK[c][k] ? { by: null } : null; }
function setCheck(c, k, on) {
  const val = on ? { by: ME, at: Date.now() } : null;
  if (!SH.live) { CHK[c] = CHK[c] || {}; if (on) CHK[c][k] = 1; else delete CHK[c][k]; save("tds:chk", CHK); render(); return; }
  if (SH.readonly) { toast("Lecture seule : demande un accès Éditeur"); render(); return; }
  SH.checks[c] = Object.assign({}, SH.checks[c] || {}, { [k]: val });
  render();
  const ref = DB.doc("checks/" + c);
  queued("checks/" + c, () => SH.checkDocs.has(String(c)) ? ref.update({ items: { [k]: val } }) : ref.set({ items: Object.assign({}, SH.checks[c]) }).then(() => SH.checkDocs.add(String(c)))).catch(failWrite);
}
function clearChecks(c) {
  if (!SH.live) { delete CHK[c]; save("tds:chk", CHK); render(); return; }
  if (SH.readonly) return;
  SH.checks[c] = {}; render();
  queued("checks/" + c, () => DB.doc("checks/" + c).set({ items: {} })).catch(failWrite);
}

/* Liste « Il manque » */
const norm = s => s.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function missingAll() { return SH.live ? SH.missing : LOCALMISS; }
function missingActive() { return missingAll().filter(m => !m.done).sort((a, b) => (a.at || 0) - (b.at || 0)); }
function missingRecentDone() { const lim = Date.now() - 24 * 3600e3; return missingAll().filter(m => m.done && (m.doneAt || 0) > lim).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)); }
function addMissing(name) {
  name = name.trim().slice(0, 60);
  if (!name) return;
  if (missingActive().some(m => norm(m.name) === norm(name))) { toast("Déjà dans la liste"); return; }
  const body = { name, by: ME, at: Date.now(), done: false };
  if (!SH.live) { LOCALMISS.push(Object.assign({ id: "l" + Date.now() }, body)); save("tds:miss", LOCALMISS); render(); toast("Ajouté"); return; }
  if (SH.readonly) { toast("Lecture seule : demande un accès Éditeur"); return; }
  const ref = DB.collection("missing").doc();
  SH.missing = SH.missing.concat([Object.assign({ id: ref.id }, body)]); render(); toast("Ajouté");
  queued("missing/" + ref.id, () => ref.set(body)).catch(failWrite);
}
function markMissing(id, done) {
  const patch = done ? { done: true, doneBy: ME, doneAt: Date.now() } : { done: false, doneBy: null, doneAt: null };
  if (!SH.live) { LOCALMISS = LOCALMISS.map(m => m.id === id ? Object.assign({}, m, patch) : m); save("tds:miss", LOCALMISS); render(); return; }
  if (SH.readonly) { render(); return; }
  SH.missing = SH.missing.map(m => m.id === id ? Object.assign({}, m, patch) : m); render();
  queued("missing/" + id, () => DB.doc("missing/" + id).update(patch)).catch(failWrite);
}
function delMissing(id) {
  if (!SH.live) { LOCALMISS = LOCALMISS.filter(m => m.id !== id); save("tds:miss", LOCALMISS); render(); return; }
  if (SH.readonly) return;
  SH.missing = SH.missing.filter(m => m.id !== id); render();
  queued("missing/" + id, () => DB.doc("missing/" + id).delete()).catch(failWrite);
}
function ago(t) {
  const m = Math.round((Date.now() - (t || 0)) / 60000);
  if (m < 1) return "à l'instant"; if (m < 60) return "il y a " + m + " min";
  const h = Math.round(m / 60); if (h < 24) return "il y a " + h + " h";
  const d = Math.round(h / 24); return "il y a " + d + " j";
}
const STAPLES = ["sel", "poivre", "sucre", "café", "thé", "farine", "papier toilette", "essuie-tout", "liquide vaisselle", "éponges", "sacs poubelle", "lessive", "savon", "dentifrice", "papier cuisson", "film alimentaire"];

  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

  if (a === "whereReset") { S.where = {}; saveSettings(); render(); return; }
  if (a === "absall") {
    const f = $("#absForm");
    f.querySelectorAll("[data-abs]").forEach(cb => { const [slot, w] = cb.dataset.abs.split("-"); cb.checked = v === "reset" ? DEFAULT_PRES[slot][w] : v === w ? false : cb.checked; cb.closest(".pill").classList.toggle("on", cb.checked); });
    return;
  }
  if (a === "wk") { st.wk = v === "0" ? mondayOf(TODAY) : Math.max(EPOCH, st.wk + +v); return render(); }
  if (a === "course") { st.course = Math.max(EPOCH, +v); return render(); }
  if (a === "swap" || a === "unswap") {
    const key = t.dataset.dn + "|" + t.dataset.slot;
    if (a === "swap") SWAPS[key] = t.dataset.id; else delete SWAPS[key];
    setSwaps(); resetCache(); closeModal(); render(); toast(a === "swap" ? "Repas changé" : "Suggestion rétablie"); return;
  }
  if (a === "rt" || a === "rs") { st[a] = v; return render(); }
  if (a === "copylist") return copy(listText(+t.dataset.c));
  if (a === "copymonth") return copy(monthText());
  if (a === "uncheck") { st.confirm = null; return clearChecks(t.dataset.c); }
  if (a === "madd") return addMissing(v);
  if (a === "mdone") return markMissing(t.dataset.id, true);
  if (a === "mundo") return markMissing(t.dataset.id, false);
  if (a === "mdel") return delMissing(t.dataset.id);
  if (a === "ask") { st.confirm = v; return render(); }
  if (a === "cancel") { st.confirm = null; return render(); }
  if (a === "reseed") { S.seed = (S.seed || 1) + 1; saveSettings(); st.confirm = null; render(); toast("Nouveau planning tiré"); return; }
  if (a === "clearswaps") { SWAPS = {}; setSwaps(); resetCache(); st.confirm = null; render(); toast("Changements effacés"); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "chk") { setCheck(t.dataset.c, t.dataset.k, t.checked); return; }
  if (t.dataset.act === "mchk") { markMissing(t.dataset.id, t.checked); return; }
  if (t.dataset.abs) { t.closest(".pill").classList.toggle("on", t.checked); return; }
  if (t.dataset.act === "ym") { const [y, m] = t.value.split("-").map(Number); st.ym = [y, m]; return render(); }
  const k = t.dataset.set; if (!k) return;
  if (k === "sport" || k === "exclude") { const v = k === "sport" ? +t.value : t.value; const arr = new Set(S[k]); t.checked ? arr.add(v) : arr.delete(v); S[k] = [...arr].sort(); }
  else if (["choco", "leftovers", "twoShops", "longOk", "snack"].includes(k)) S[k] = t.checked;
  else if (["shop1", "shop2", "maxWeek", "maxWeekend"].includes(k)) S[k] = +t.value;
  else if (["weight", "kcal", "fT", "fA"].includes(k)) { const n = parseFloat(t.value); if (!isFinite(n)) return; S[k] = n; }
  else S[k] = t.value;
  saveSettings(); render();
});
document.addEventListener("input", e => { if (e.target.id === "rq") { st.rq = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#rq"); i.focus(); i.setSelectionRange(pos, pos); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const h = (location.hash || "").slice(1);
if (VIEWS.includes(h)) st.view = h;
render();
startSync();
if (st.view === "semaine") { const el = document.getElementById("d" + TODAY); if (el && window.innerWidth < 700) el.scrollIntoView({ block: "start" }); }
</script>
